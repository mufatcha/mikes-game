<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>School Wars</title>
    <style>
      body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; background: #0b0d12; color: #fff; font-family: system-ui, sans-serif; text-align: center; padding: 16px; box-sizing: border-box; }
      p { color: #a1a1aa; }
      button { font-size: 18px; padding: 12px 24px; margin: 6px; border-radius: 10px; border: 0; font-weight: 700; cursor: pointer; }
      .go { background: #facc15; }
      .quit { background: #27272a; color: #fff; }
    </style>
  </head>
  <body>
    <div>
      <img src="icon.png" width="112" height="112" alt="" style="border-radius: 24px" />
      <h1>Can't reach School Wars</h1>
      <p>Check your internet connection, then try again.</p>
      <button class="go" onclick="window.schoolWarsDesktop.retry()">Try again</button>
      <button class="quit" onclick="window.schoolWarsDesktop.quit()">Quit</button>
    </div>
    <script>
      // A controller's A button retries too.
      setInterval(() => {
        const pad = [...navigator.getGamepads()].find(Boolean);
        if (pad && pad.buttons[0] && pad.buttons[0].pressed) window.schoolWarsDesktop.retry();
      }, 100);
    </script>
  </body>
</html>
